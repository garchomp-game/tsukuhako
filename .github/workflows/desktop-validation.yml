name: Desktop validation artifacts
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build only the selected OS (Windows runtime remains unverified)
        type: choice
        options: [linux, windows]
        default: linux
        required: true
permissions:
  contents: read
concurrency:
  group: desktop-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix generator
      - run: npm ci --prefix generator-desktop
      - run: npm ci --prefix tools
        if: inputs.platform == 'windows'
      - run: node generator-desktop/node_modules/electron/install.js
      - run: npm run build --prefix generator-desktop
      - run: python tools/build-helper.py
      - run: node tools/stage-desktop.mjs
      - run: python tools/verify-helper-archive.py dist/desktop-app
      - name: Core and desktop regression tests (Linux)
        if: inputs.platform == 'linux'
        run: |
          npm test --prefix generator
          npm test --prefix generator-desktop
          npm run test:package --prefix generator-desktop
      - name: Linux x64 deb
        if: inputs.platform == 'linux'
        run: npm run package:linux --prefix generator-desktop
      - name: Windows x64 NSIS
        if: inputs.platform == 'windows'
        run: npm run package:windows --prefix generator-desktop
      - name: Inspect packaged Windows resources and unsigned installer
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          node tools/verify-desktop-bundle.mjs dist/windows-x64/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw 'Packaged resource check failed' }
          python tools/verify-helper-archive.py dist/windows-x64/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw 'Packaged helper check failed' }
          $installer = Get-Item dist/windows-x64/*-setup.exe
          node tools/artifact-manifest.mjs $installer.FullName windows
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed' }
          $sig = Get-AuthenticodeSignature $installer.FullName
          @{ file=$installer.Name; status=$sig.Status.ToString(); subject=$sig.SignerCertificate.Subject; category='CI'; osRuntimeVerification='NOT_RUN' } | ConvertTo-Json | Set-Content -Encoding utf8 dist/windows-x64/signature.json
          if ($sig.Status -ne 'NotSigned') { throw 'Unexpected signature state; inspect before distribution' }
      - name: Installed Windows application smoke
        id: windowsSmoke
        continue-on-error: true
        if: inputs.platform == 'windows'
        timeout-minutes: 7
        shell: pwsh
        run: |
          $installer = Get-Item dist/windows-x64/*-setup.exe
          ./tools/windows-installer-smoke.ps1 -Installer $installer.FullName
      - name: Windows smoke evidence (also on failure)
        if: always() && inputs.platform == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tsukuhako-windows-smoke-evidence
          path: dist/windows-smoke/
          retention-days: 14
          if-no-files-found: warn
      - name: Assemble Windows recipient folder
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-Item dist/windows-x64/*-setup.exe
          node tools/delivery-pack.mjs $installer.FullName windows dist/delivery/windows
          if ($LASTEXITCODE -ne 0) { throw 'Delivery pack failed' }
      - name: Assemble Linux recipient folder
        if: inputs.platform == 'linux'
        run: |
          product_version=$(node -p "require('./generator-desktop/package.json').version")
          node tools/linux-deb/deliver.mjs "dist/linux-deb/tsukuhako-linux-amd64-${product_version}.deb" dist/delivery/linux
      - name: Windows recipient download (build artifact; no release publishing)
        if: inputs.platform == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tsukuhako-windows-x64-delivery
          path: dist/delivery/windows/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Linux recipient download (build artifact; no release publishing)
        if: inputs.platform == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tsukuhako-linux-x64-delivery
          path: dist/delivery/linux/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Report a failed smoke after preserving artifacts
        if: inputs.platform == 'windows' && steps.windowsSmoke.outcome == 'failure'
        shell: pwsh
        run: throw 'Installed Windows smoke did not pass; artifacts and partial evidence were retained'
