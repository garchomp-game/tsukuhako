name: I1 SQL checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure isolated local database
        run: bash scripts/configure.sh --name ci --port 55432
      - name: Start the same workbench and database
        run: bash scripts/project.sh start
      - name: Migrations, seed, and semantic SQL tests
        run: |
          bash scripts/project.sh db setup
          bash scripts/project.sh db setup
          bash scripts/project.sh db check
      - name: Stop this job's Compose project
        if: always()
        run: bash scripts/project.sh down
