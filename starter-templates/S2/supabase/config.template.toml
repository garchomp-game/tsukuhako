# Generated as config.toml by scripts/db.sh from .env. Never link this learning DB to a cloud project.
project_id = "__PROJECT_ID__"

[api]
enabled = true
port = __API_PORT__
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = __DB_PORT__
shadow_port = __SHADOW_PORT__
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = __STUDIO_PORT__
api_url = "http://127.0.0.1"

[local_smtp]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:__APP_PORT__"
enable_signup = false
enable_anonymous_sign_ins = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
